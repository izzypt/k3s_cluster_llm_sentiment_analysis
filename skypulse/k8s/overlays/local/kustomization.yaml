# Local overlay: the base, with images coming from the k3d registry.
# `make start` / `make update` rewrite the newTag values to the freshly built versions.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: skypulse-app
    newName: localhost:5050/skypulse-app
    newTag: dev
  - name: skypulse-llm
    newName: localhost:5050/skypulse-llm
    newTag: dev
