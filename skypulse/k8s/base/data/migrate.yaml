# Schema migrations + GRANTs for the application roles, run on every deploy.
#
# It runs here, in the data namespace, because it needs the schema owner's credentials
# (Secret feeddb-app, generated by CloudNativePG) and those must never be copied into the
# application namespaces. Migrations are idempotent and serialised with an advisory lock.
#
# A Job's pod template is immutable, so `make deploy` deletes the previous Job before
# applying; Argo CD does the same through the hook annotations below.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: skypulse-data
  labels:
    app.kubernetes.io/name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10              # the database may still be starting: retry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: skypulse-app
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: feeddb-app      # schema owner, generated by CloudNativePG
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
