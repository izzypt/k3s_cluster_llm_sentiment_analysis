# The analysts' web app + JSON API. This is the component that must be highly available.
#
# HA toolbox used here:
#   - >= 2 replicas (HorizontalPodAutoscaler minReplicas), spread across nodes
#   - readiness probe: a pod only gets traffic when it can query the (migrated) database
#   - RollingUpdate with maxUnavailable: 0 -> zero-downtime software updates
#   - preStop sleep: give the ingress time to stop routing to a terminating pod
#   - PodDisruptionBudget: node maintenance (kubectl drain) can never take all replicas down
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: skypulse-analysis
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: web
spec:
  # No "replicas:" on purpose: the HorizontalPodAutoscaler below owns that number.
  # (If we set it here, every `kubectl apply` would reset the HPA's decision.)
  revisionHistoryLimit: 5          # keep 5 old ReplicaSets for `kubectl rollout undo`
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false             # no <SERVICE>_PORT env vars: e.g. Service "api" would inject API_PORT=tcp://… and clash with app settings
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: skypulse-app
          args: ["api"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: analysis-config
          env:                          # login as the least-privilege "analysis" role
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: analysis-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: analysis-db-credentials
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: skypulse-analysis
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: skypulse-analysis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: skypulse-analysis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
