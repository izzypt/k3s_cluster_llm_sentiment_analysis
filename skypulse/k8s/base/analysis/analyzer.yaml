# Background worker: classifies posts with the LLM and writes per-subscription summaries.
# Safe to scale out (work is claimed with SELECT ... FOR UPDATE SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  namespace: skypulse-analysis
  labels:
    app.kubernetes.io/name: analyzer
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analyzer
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false             # no <SERVICE>_PORT env vars: e.g. Service "api" would inject API_PORT=tcp://… and clash with app settings
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analyzer
          image: skypulse-app
          args: ["analyzer"]
          envFrom:
            - configMapRef:
                name: analysis-config
          env:                          # login as the least-privilege "analysis" role
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: analysis-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: analysis-db-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          # A worker has no HTTP port, so liveness = "the main loop touched its heartbeat file
          # in the last 10 minutes". A stuck loop gets the container restarted.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 600)"
            initialDelaySeconds: 30
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
