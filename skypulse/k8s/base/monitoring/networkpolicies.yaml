# The monitoring namespace follows the same rules as the rest: deny everything, then open
# exactly the paths it needs. It reads metrics; it never reaches application ports, the
# database's SQL port or the internet, and the application zones cannot reach it.
#
#   ingress controller ──► grafana ──► prometheus ──► postgres :9187 (skypulse-data)
#                                                 └─► ingress controller :9100 (kube-system)
#                                                 └─► Kubernetes API (pod discovery)
#
#
# "Monitoring needs no app instrumentation. 
# Pipeline health comes from SQL queries the CNPG exporter runs against the tables, and API health comes from the ingress controller's metrics. 
# Prometheus's only API rights are listing pods in two namespaces, Grafana is stateless and provisioned from Git, and neither can reach the internet or read post content. 
# Alerting is the next step."
#
#
#
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: skypulse-monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: skypulse-monitoring
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: skypulse-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: skypulse-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: skypulse-data
          podSelector:
            matchLabels:
              cnpg.io/cluster: feeddb
      ports:
        - { protocol: TCP, port: 9187 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 9100 }
    # Pod discovery through the Kubernetes API server, which lives on the local network
    # (same rule as the database's instance manager in data/networkpolicies.yaml).
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
